name: release

# Builds the prebuilt binaries that the npm package downloads on install.
# Push a tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to cut a
# release; the assets are named exactly like lib/platform.js expects.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14,      goos: darwin,  goarch: arm64,  asset: opendrain-darwin-arm64 }
          - { runner: macos-13,      goos: darwin,  goarch: amd64,  asset: opendrain-darwin-amd64 }
          - { runner: ubuntu-latest, goos: linux,   goarch: amd64,  asset: opendrain-linux-amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64, asset: opendrain-linux-arm64 }
          - { runner: windows-latest, goos: windows, goarch: amd64, asset: opendrain-windows-amd64.exe }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.asset }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          FILES=$(find dist -type f)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "$TAG" --generate-notes
          fi
